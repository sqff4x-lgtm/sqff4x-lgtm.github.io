<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Города мира</title>
</head>
<body>
  <div id="cities-root" class="cities-wrapper" data-collection="world">
    <div id="city-1" class="city" data-country="Россия" data-capital="true">
      <img id="city-photo-1" class="city-photo" src="moscow.jpg" alt="Москва">
      <span class="city-name" data-latin="Moscow">Москва</span>
      <span class="city-population" data-year="2024">12 500 000</span>
      <span class="city-area" data-unit="km2">2561 км²</span>
      <div class="city-facts">
        <span class="fact" data-type="status">Столица России</span>
        <span class="fact" data-type="history">Основана в 1147</span>
      </div>
    </div>

    <div id="city-2" class="city" data-country="Франция" data-capital="true">
      <img id="city-photo-2" class="city-photo" src="paris.jpg" alt="Париж">
      <span class="city-name" data-latin="Paris">Париж</span>
      <span class="city-population" data-year="2024">2 100 000</span>
      <span class="city-area" data-unit="km2">105 км²</span>
      <div class="city-facts">
        <span class="fact" data-type="status">Столица Франции</span>
        <span class="fact" data-type="landmark">Эйфелева башня</span>
      </div>
    </div>

    <div id="city-3" class="city" data-country="Япония" data-capital="true">
      <img id="city-photo-3" class="city-photo" src="tokyo.jpg" alt="Токио">
      <span class="city-name" data-latin="Tokyo">Токио</span>
      <span class="city-population" data-year="2024">14 000 000</span>
      <span class="city-area" data-unit="km2">2194 км²</span>
      <div class="city-facts">
        <span class="fact" data-type="status">Столица Японии</span>
        <span class="fact" data-type="record">Самый большой мегаполис</span>
      </div>
    </div>
  </div>
</body>
</html>
