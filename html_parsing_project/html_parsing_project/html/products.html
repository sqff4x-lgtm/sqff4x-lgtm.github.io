<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин электроники</title>
</head>
<body>
  <div id="products-root" class="products-grid" data-shop="electronics">
    <div id="product-1" class="product" data-category="смартфоны" data-brand="Apple">
      <img id="product-image-1" class="product-image" src="iphone.jpg" alt="iPhone 15">
      <span class="product-name" data-model="A3102">iPhone 15 Pro</span>
      <span class="product-brand">Apple</span>
      <span class="product-price" data-currency="RUB" data-old="129990">119 990 ₽</span>
      <span class="product-stock" data-qty="15">В наличии</span>
      <span class="product-rating" data-reviews="340">4.8</span>
    </div>

    <div id="product-2" class="product" data-category="ноутбуки" data-brand="Apple">
      <img id="product-image-2" class="product-image" src="macbook.jpg" alt="MacBook Pro">
      <span class="product-name" data-model="MRX33">MacBook Pro 14</span>
      <span class="product-brand">Apple</span>
      <span class="product-price" data-currency="RUB" data-old="219990">199 990 ₽</span>
      <span class="product-stock" data-qty="7">В наличии</span>
      <span class="product-rating" data-reviews="210">4.9</span>
    </div>

    <div id="product-3" class="product" data-category="наушники" data-brand="Apple">
      <img id="product-image-3" class="product-image" src="airpods.jpg" alt="AirPods">
      <span class="product-name" data-model="MTJV3">AirPods Pro 2</span>
      <span class="product-brand">Apple</span>
      <span class="product-price" data-currency="RUB" data-old="27990">24 990 ₽</span>
      <span class="product-stock" data-qty="0">Нет в наличии</span>
      <span class="product-rating" data-reviews="520">4.7</span>
    </div>
  </div>
</body>
</html>
