<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Языки программирования</title>
</head>
<body>
  <div id="langs-root" class="langs-container" data-topic="programming">
    <div id="lang-1" class="lang" data-paradigm="multi" data-typing="dynamic">
      <img id="lang-logo-1" class="lang-logo" src="python.png" alt="Python">
      <span class="lang-name" data-version="3.12">Python</span>
      <span class="lang-year">1991</span>
      <span class="lang-author" data-country="Нидерланды">Гвидо ван Россум</span>
      <div class="lang-features">
        <span class="feature" data-id="dynamic">Динамическая типизация</span>
        <span class="feature" data-id="interpreted">Интерпретируемый</span>
      </div>
    </div>

    <div id="lang-2" class="lang" data-paradigm="oop" data-typing="static">
      <img id="lang-logo-2" class="lang-logo" src="java.png" alt="Java">
      <span class="lang-name" data-version="21">Java</span>
      <span class="lang-year">1995</span>
      <span class="lang-author" data-country="Канада">Джеймс Гослинг</span>
      <div class="lang-features">
        <span class="feature" data-id="jvm">JVM</span>
        <span class="feature" data-id="crossplatform">Кроссплатформенный</span>
      </div>
    </div>

    <div id="lang-3" class="lang" data-paradigm="functional" data-typing="static">
      <img id="lang-logo-3" class="lang-logo" src="haskell.png" alt="Haskell">
      <span class="lang-name" data-version="9.6">Haskell</span>
      <span class="lang-year">1990</span>
      <span class="lang-author" data-country="Международный">Комитет Haskell</span>
      <div class="lang-features">
        <span class="feature" data-id="pure">Чисто функциональный</span>
        <span class="feature" data-id="lazy">Ленивые вычисления</span>
      </div>
    </div>
  </div>
</body>
</html>
