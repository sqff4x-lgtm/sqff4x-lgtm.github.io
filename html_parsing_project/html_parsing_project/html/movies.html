<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог фильмов</title>
</head>
<body>
  <div id="movies-root" class="movies-list" data-source="kinopoisk">
    <div id="movie-1" class="movie-card" data-year="1994" data-country="США">
      <img id="poster-1" class="poster" src="shawshank.jpg" alt="Побег из Шоушенка">
      <span class="movie-title" data-original="The Shawshank Redemption">Побег из Шоушенка</span>
      <span class="movie-year">1994</span>
      <span class="movie-rating" data-votes="2500000">9.3</span>
      <div class="movie-genres">
        <span class="genre" data-id="drama">Драма</span>
        <span class="genre" data-id="crime">Криминал</span>
      </div>
    </div>

    <div id="movie-2" class="movie-card" data-year="1972" data-country="США">
      <img id="poster-2" class="poster" src="godfather.jpg" alt="Крёстный отец">
      <span class="movie-title" data-original="The Godfather">Крёстный отец</span>
      <span class="movie-year">1972</span>
      <span class="movie-rating" data-votes="1900000">9.2</span>
      <div class="movie-genres">
        <span class="genre" data-id="drama">Драма</span>
        <span class="genre" data-id="crime">Криминал</span>
      </div>
    </div>

    <div id="movie-3" class="movie-card" data-year="2010" data-country="США">
      <img id="poster-3" class="poster" src="inception.jpg" alt="Начало">
      <span class="movie-title" data-original="Inception">Начало</span>
      <span class="movie-year">2010</span>
      <span class="movie-rating" data-votes="2300000">8.8</span>
      <div class="movie-genres">
        <span class="genre" data-id="scifi">Фантастика</span>
        <span class="genre" data-id="thriller">Триллер</span>
      </div>
    </div>
  </div>
</body>
</html>
