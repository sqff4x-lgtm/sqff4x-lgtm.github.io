<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Животные мира</title>
</head>
<body>
  <div id="animals-root" class="animals-wrapper" data-zone="world">
    <div id="animal-1" class="animal" data-class="млекопитающее" data-diet="хищник">
      <img id="animal-photo-1" class="animal-photo" src="lion.jpg" alt="Лев">
      <span class="animal-name" data-latin="Panthera leo">Лев</span>
      <span class="animal-latin">Panthera leo</span>
      <span class="animal-weight" data-kg="190">190 кг</span>
      <span class="animal-habitat" data-continent="Африка">Африка</span>
      <div class="animal-facts">
        <span class="fact" data-type="diet">Хищник</span>
        <span class="fact" data-type="social">Живёт прайдами</span>
      </div>
    </div>

    <div id="animal-2" class="animal" data-class="млекопитающее" data-diet="травоядное">
      <img id="animal-photo-2" class="animal-photo" src="elephant.jpg" alt="Слон">
      <span class="animal-name" data-latin="Loxodonta">Африканский слон</span>
      <span class="animal-latin">Loxodonta</span>
      <span class="animal-weight" data-kg="6000">6000 кг</span>
      <span class="animal-habitat" data-continent="Африка">Африка</span>
      <div class="animal-facts">
        <span class="fact" data-type="diet">Травоядное</span>
        <span class="fact" data-type="record">Самое крупное наземное</span>
      </div>
    </div>

    <div id="animal-3" class="animal" data-class="птица" data-diet="хищник">
      <img id="animal-photo-3" class="animal-photo" src="eagle.jpg" alt="Орёл">
      <span class="animal-name" data-latin="Aquila chrysaetos">Беркут</span>
      <span class="animal-latin">Aquila chrysaetos</span>
      <span class="animal-weight" data-kg="6">6 кг</span>
      <span class="animal-habitat" data-continent="Евразия">Евразия, Северная Америка</span>
      <div class="animal-facts">
        <span class="fact" data-type="diet">Хищник</span>
        <span class="fact" data-type="wingspan">Размах крыльев 2 м</span>
      </div>
    </div>
  </div>
</body>
</html>
