<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог книг</title>
</head>
<body>
  <div id="books-root" class="books-grid" data-library="main">
    <div id="book-1" class="book" data-genre="fantasy" data-language="en">
      <img id="book-cover-1" class="book-cover" src="lotr.jpg" alt="Властелин колец">
      <span class="book-title" data-original="The Lord of the Rings">Властелин колец</span>
      <span class="book-author" data-country="Великобритания">Дж. Р. Р. Толкин</span>
      <span class="book-year">1954</span>
      <span class="book-pages" data-format="hardcover">1178</span>
      <div class="book-tags">
        <span class="tag" data-id="fantasy">Фэнтези</span>
        <span class="tag" data-id="adventure">Приключения</span>
      </div>
    </div>

    <div id="book-2" class="book" data-genre="classic" data-language="ru">
      <img id="book-cover-2" class="book-cover" src="crime.jpg" alt="Преступление и наказание">
      <span class="book-title" data-original="Преступление и наказание">Преступление и наказание</span>
      <span class="book-author" data-country="Россия">Ф. М. Достоевский</span>
      <span class="book-year">1866</span>
      <span class="book-pages" data-format="hardcover">671</span>
      <div class="book-tags">
        <span class="tag" data-id="classic">Классика</span>
        <span class="tag" data-id="psychology">Психология</span>
      </div>
    </div>

    <div id="book-3" class="book" data-genre="scifi" data-language="en">
      <img id="book-cover-3" class="book-cover" src="dune.jpg" alt="Дюна">
      <span class="book-title" data-original="Dune">Дюна</span>
      <span class="book-author" data-country="США">Фрэнк Герберт</span>
      <span class="book-year">1965</span>
      <span class="book-pages" data-format="paperback">688</span>
      <div class="book-tags">
        <span class="tag" data-id="scifi">Фантастика</span>
        <span class="tag" data-id="space">Космос</span>
      </div>
    </div>
  </div>
</body>
</html>
