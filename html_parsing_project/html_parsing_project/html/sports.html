<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Известные спортсмены</title>
</head>
<body>
  <div id="sports-root" class="sports-list" data-region="world">
    <div id="athlete-1" class="athlete" data-sport="футбол" data-active="true">
      <img id="athlete-photo-1" class="athlete-photo" src="messi.jpg" alt="Месси">
      <span class="athlete-name" data-first="Лионель" data-last="Месси">Лионель Месси</span>
      <span class="athlete-country" data-code="AR">Аргентина</span>
      <span class="athlete-born" data-date="1987-06-24">1987</span>
      <span class="athlete-team" data-league="MLS">Inter Miami</span>
      <span class="athlete-number">10</span>
    </div>

    <div id="athlete-2" class="athlete" data-sport="теннис" data-active="true">
      <img id="athlete-photo-2" class="athlete-photo" src="djokovic.jpg" alt="Джокович">
      <span class="athlete-name" data-first="Новак" data-last="Джокович">Новак Джокович</span>
      <span class="athlete-country" data-code="RS">Сербия</span>
      <span class="athlete-born" data-date="1987-05-22">1987</span>
      <span class="athlete-team" data-league="ATP">ATP</span>
      <span class="athlete-number">1</span>
    </div>

    <div id="athlete-3" class="athlete" data-sport="баскетбол" data-active="true">
      <img id="athlete-photo-3" class="athlete-photo" src="james.jpg" alt="Джеймс">
      <span class="athlete-name" data-first="Леброн" data-last="Джеймс">Леброн Джеймс</span>
      <span class="athlete-country" data-code="US">США</span>
      <span class="athlete-born" data-date="1984-12-30">1984</span>
      <span class="athlete-team" data-league="NBA">LA Lakers</span>
      <span class="athlete-number">23</span>
    </div>
  </div>
</body>
</html>
