<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Праздники мира</title>
</head>
<body>
  <div id="holidays-root" class="holidays-container" data-scope="world">
    <div id="holiday-1" class="holiday" data-type="национальный" data-month="1">
      <img id="holiday-icon-1" class="holiday-icon" src="newyear.jpg" alt="Новый год">
      <span class="holiday-name" data-en="New Year">Новый год</span>
      <span class="holiday-date" data-day="1" data-month="1">1 января</span>
      <span class="holiday-country" data-code="WORLD">Мир</span>
      <span class="holiday-desc">Главный зимний праздник</span>
    </div>

    <div id="holiday-2" class="holiday" data-type="религиозный" data-month="4">
      <img id="holiday-icon-2" class="holiday-icon" src="easter.jpg" alt="Пасха">
      <span class="holiday-name" data-en="Easter">Пасха</span>
      <span class="holiday-date" data-day="varies" data-month="4">апрель</span>
      <span class="holiday-country" data-code="WORLD">Мир</span>
      <span class="holiday-desc">Христианский праздник</span>
    </div>

    <div id="holiday-3" class="holiday" data-type="национальный" data-month="5">
      <img id="holiday-icon-3" class="holiday-icon" src="victory.jpg" alt="День Победы">
      <span class="holiday-name" data-en="Victory Day">День Победы</span>
      <span class="holiday-date" data-day="9" data-month="5">9 мая</span>
      <span class="holiday-country" data-code="RU">Россия</span>
      <span class="holiday-desc">Окончание ВОВ</span>
    </div>
  </div>
</body>
</html>
