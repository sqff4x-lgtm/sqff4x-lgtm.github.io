<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Классическая музыка</title>
</head>
<body>
  <div id="music-root" class="music-list" data-era="classical">
    <div id="composition-1" class="composition" data-composer="Бетховен" data-key="D minor">
      <img id="cover-1" class="cover" src="beethoven9.jpg" alt="Симфония №9">
      <span class="title" data-opus="Op. 125">Симфония №9</span>
      <span class="composer" data-country="Германия">Людвиг ван Бетховен</span>
      <span class="year">1824</span>
      <span class="duration" data-seconds="4200">70 мин</span>
      <span class="genre" data-id="symphony">Симфония</span>
    </div>

    <div id="composition-2" class="composition" data-composer="Моцарт" data-key="G minor">
      <img id="cover-2" class="cover" src="mozart40.jpg" alt="Симфония №40">
      <span class="title" data-opus="K. 550">Симфония №40</span>
      <span class="composer" data-country="Австрия">Вольфганг Амадей Моцарт</span>
      <span class="year">1788</span>
      <span class="duration" data-seconds="1800">30 мин</span>
      <span class="genre" data-id="symphony">Симфония</span>
    </div>

    <div id="composition-3" class="composition" data-composer="Чайковский" data-key="E minor">
      <img id="cover-3" class="cover" src="nutcracker.jpg" alt="Щелкунчик">
      <span class="title" data-opus="Op. 71">Щелкунчик</span>
      <span class="composer" data-country="Россия">Пётр Чайковский</span>
      <span class="year">1892</span>
      <span class="duration" data-seconds="5400">90 мин</span>
      <span class="genre" data-id="ballet">Балет</span>
    </div>
  </div>
</body>
</html>
