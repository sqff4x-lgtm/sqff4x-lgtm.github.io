<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Автомобили</title>
</head>
<body>
  <div id="cars-root" class="cars-list" data-market="ru">
    <div id="car-1" class="car" data-brand="BMW" data-body="sedan">
      <img id="car-photo-1" class="car-photo" src="bmw_m5.jpg" alt="BMW M5">
      <span class="model" data-generation="G90">BMW M5</span>
      <span class="year">2023</span>
      <span class="engine" data-volume="4.4">4.4 V8</span>
      <span class="power" data-hp="625">625 л.с.</span>
      <span class="price" data-currency="RUB">12 500 000 ₽</span>
    </div>

    <div id="car-2" class="car" data-brand="Tesla" data-body="liftback">
      <img id="car-photo-2" class="car-photo" src="model_s.jpg" alt="Tesla Model S">
      <span class="model" data-generation="Palladium">Tesla Model S</span>
      <span class="year">2023</span>
      <span class="engine" data-volume="0">Электро</span>
      <span class="power" data-hp="670">670 л.с.</span>
      <span class="price" data-currency="RUB">8 900 000 ₽</span>
    </div>

    <div id="car-3" class="car" data-brand="Toyota" data-body="sedan">
      <img id="car-photo-3" class="car-photo" src="camry.jpg" alt="Toyota Camry">
      <span class="model" data-generation="XV80">Toyota Camry</span>
      <span class="year">2023</span>
      <span class="engine" data-volume="2.5">2.5</span>
      <span class="power" data-hp="200">200 л.с.</span>
      <span class="price" data-currency="RUB">3 200 000 ₽</span>
    </div>
  </div>
</body>
</html>
