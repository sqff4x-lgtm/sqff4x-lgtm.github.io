<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Рецепты блюд</title>
</head>
<body>
  <div id="recipes-root" class="recipes" data-book="main">
    <div id="recipe-1" class="recipe" data-cuisine="итальянская" data-vegetarian="true">
      <img id="recipe-photo-1" class="recipe-photo" src="pizza.jpg" alt="Пицца">
      <span class="recipe-name" data-original="Pizza Margherita">Пицца Маргарита</span>
      <span class="recipe-time" data-minutes="30">30 мин</span>
      <span class="recipe-calories" data-per="100g">250 ккал</span>
      <div class="ingredients">
        <span class="ingredient" data-amount="500g">Тесто</span>
        <span class="ingredient" data-amount="200g">Томаты</span>
        <span class="ingredient" data-amount="150g">Моцарелла</span>
        <span class="ingredient" data-amount="10g">Базилик</span>
      </div>
    </div>

    <div id="recipe-2" class="recipe" data-cuisine="японская" data-vegetarian="false">
      <img id="recipe-photo-2" class="recipe-photo" src="sushi.jpg" alt="Суши">
      <span class="recipe-name" data-original="Sushi">Суши</span>
      <span class="recipe-time" data-minutes="60">60 мин</span>
      <span class="recipe-calories" data-per="100g">180 ккал</span>
      <div class="ingredients">
        <span class="ingredient" data-amount="300g">Рис</span>
        <span class="ingredient" data-amount="10pcs">Нори</span>
        <span class="ingredient" data-amount="200g">Лосось</span>
      </div>
    </div>

    <div id="recipe-3" class="recipe" data-cuisine="русская" data-vegetarian="false">
      <img id="recipe-photo-3" class="recipe-photo" src="borscht.jpg" alt="Борщ">
      <span class="recipe-name" data-original="Borscht">Борщ</span>
      <span class="recipe-time" data-minutes="90">90 мин</span>
      <span class="recipe-calories" data-per="100g">120 ккал</span>
      <div class="ingredients">
        <span class="ingredient" data-amount="300g">Свёкла</span>
        <span class="ingredient" data-amount="200g">Капуста</span>
        <span class="ingredient" data-amount="400g">Мясо</span>
        <span class="ingredient" data-amount="300g">Картофель</span>
      </div>
    </div>
  </div>
</body>
</html>
